version: '3'

tasks:
  fmt:
    desc: Format all Go source files
    cmds:
      - find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -w

  fmt:check:
    desc: Verify Go source files are formatted
    cmds:
      - test -z "$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"

  vet:
    desc: Run Go vet across every package
    cmds:
      - go vet ./...

  test:
    desc: Run uncached tests across every package
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Run the full repository suite with Go's race detector
    cmds:
      - go test -race -count=1 ./...

  test:coverage:config:
    desc: Write and report per-function coverage for the config package
    cmds:
      - mkdir -p .dist/coverage
      - go test -count=1 -coverprofile=.dist/coverage/config.out ./config
      - go tool cover -func=.dist/coverage/config.out

  test:fuzz:
    desc: Run each config fuzz target briefly
    cmds:
      - go test ./config -run '^$' -fuzz=FuzzJSONFormat -fuzztime=1s
      - go test ./config -run '^$' -fuzz=FuzzStringConversion -fuzztime=1s

  test:race:*:
    desc: Run race tests for one package directory (for example, task test:race:config)
    vars:
      PACKAGE_DIR: '{{index .MATCH 0}}'
    dir: '{{.PACKAGE_DIR}}'
    cmds:
      - go test -race -count=1 .

  test:*:
    desc: Run uncached tests for one package directory (for example, task test:config)
    vars:
      PACKAGE_DIR: '{{index .MATCH 0}}'
    dir: '{{.PACKAGE_DIR}}'
    cmds:
      - go test -count=1 .

  check:
    desc: Format-check, vet, and test the repository
    deps: ['fmt:check', vet, test, test:race, test:fuzz]
