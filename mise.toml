[tools]
go = "1.26"
golangci-lint = "2.13.0"

[tasks.fmt]
description = "Format all Go source files"
run = "go fmt ./..."

[tasks."fmt:check"]
description = "Verify Go source files are formatted"
run = 'test -z "$(gofmt -l .)"'

[tasks.vet]
description = "Run Go vet across every package"
run = "go vet ./..."

[tasks."mod:check"]
description = "Verify module metadata is tidy without changing it"
run = "go mod tidy -diff"

[tasks.lint]
description = "Run golangci-lint across every package"
run = "./tests/lint/run.sh"

[tasks.test]
description = "Run uncached tests across every package or one directory"
usage = '''
arg "[dir]" help="Repository-relative directory to test" default="."
'''
run = './tests/unit/run.sh "${usage_dir?}"'

[tasks."test:race"]
description = "Run race tests across every package or one directory"
usage = '''
arg "[dir]" help="Repository-relative directory to test" default="."
'''
run = './tests/unit/run.sh --race "${usage_dir?}"'

[tasks."test:coverage:config"]
description = "Write and report per-function coverage for the config package"
run = './tests/unit/run.sh --coverage config'

[tasks."test:fuzz"]
description = "Run each config fuzz target briefly"
run = './tests/unit/run.sh --fuzz'

[tasks.check]
description = "Verify formatting, module metadata, lint, vet, tests, race tests, and fuzz smoke tests"
depends = ["fmt:check", "mod:check", "lint", "vet", "test", "test:race", "test:fuzz"]
